[[module.definitions]]
  name = "UnitStatus"
  body = '''
enum UnitStatus
{
  UNIT_STATUS_NONE,

  UNIT_STATUS_POISON,
  UNIT_STATUS_SLEEP,
  UNIT_STATUS_SILENCE,
  UNIT_STATUS_BERSERK,

  #if defined(__FE7U__) || defined(__FE7J__) || defined(__FE8U__) || defined(__FE8U__)

  UNIT_STATUS_ATTACK,
  UNIT_STATUS_DEFENSE,
  UNIT_STATUS_CRIT,
  UNIT_STATUS_AVOID,

  #endif // defined(__FE7U__) || defined(__FE7J__) || defined(__FE8U__) || defined(__FE8U__)

  #if defined(__FE8U__) || defined(__FE8J__)

  UNIT_STATUS_SICK,
  UNIT_STATUS_GORGON_EGG,
  UNIT_STATUS_PETRIFY,
  UNIT_STATUS_GREAT_SHIELD_PROC,
  UNIT_STATUS_PETRIFY_BY_ALLY,

  #endif // defined(__FE8U__) || defined(__FE8J__)

  UNIT_STATUS_MAX,

};'''


